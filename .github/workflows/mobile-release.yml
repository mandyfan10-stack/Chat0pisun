name: Mobile Release (APK)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          # Pin to specific versions to avoid unexpected breakage on major EAS CLI updates
          expo-version: 0.22.6
          eas-version: 14.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Build APK
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile preview --non-interactive --wait --output=./messenger-v${{ github.ref_name }}.apk

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/messenger-v${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
