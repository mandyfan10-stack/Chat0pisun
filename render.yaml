services:
  - type: web
    name: messenger-api
    env: node
    buildCommand: npm install && cd apps/api && npm run build
    startCommand: cd apps/api && node dist/index.js
    envVars:
      - key: PORT
        value: 4000

  - type: web
    name: messenger-web
    env: static
    buildCommand: npm install && cd apps/web && npm run build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://messenger-api.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://messenger-api.onrender.com
