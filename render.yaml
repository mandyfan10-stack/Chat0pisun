services:
  # API Service (Docker-based)
  - type: web
    name: messenger-api
    env: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: free # Change to starter/pro for production
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard (PostgreSQL connection string)
      - key: REDIS_URL
        fromService:
          type: redis
          name: messenger-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        # IMPORTANT: after first deploy set this to the exact URL of messenger-web
        # e.g. https://messenger-web.onrender.com
        # Do NOT leave as "*" in production
        fromService:
          type: static
          name: messenger-web
          property: host

  # Web Frontend (Static Site)
  - type: static
    name: messenger-web
    env: static
    rootDir: apps/web
    buildCommand: npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: messenger-api
          property: host

  # Redis Instance (Managed by Render)
  - type: redis
    name: messenger-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic
