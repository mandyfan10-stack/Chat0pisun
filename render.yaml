services:
  # API Service (Docker-based)
  - type: web
    name: messenger-api
    env: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: free # Change to starter/pro for production
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard (MongoDB Atlas URL)
      - key: REDIS_URL
        fromService:
          type: redis
          name: messenger-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*" # Update this with the Web URL after first deploy

  # Web Frontend (Static Site)
  - type: static
    name: messenger-web
    env: static
    rootDir: apps/web
    buildCommand: npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: messenger-api
          property: host

  # Redis Instance (Managed by Render)
  - type: redis
    name: messenger-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic
