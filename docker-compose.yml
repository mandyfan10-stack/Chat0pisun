services:
  db:
    image: postgres:16-alpine
    container_name: messenger-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-messenger}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: messenger-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: messenger-api
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-messenger}?schema=public
      REDIS_URL: redis://redis:6379
      # JWT_SECRET must be set explicitly — no insecure default.
      # Generate with: openssl rand -base64 32
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required — run: openssl rand -base64 32}"
      PORT: 4000
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      S3_ENABLED: ${S3_ENABLED:-false}
    volumes:
      # Persist local uploads when S3 is disabled
      - uploads_data:/app/apps/api/uploads

volumes:
  postgres_data:
  uploads_data:
